<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris NFC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc;
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 30px 20px; 
        }
        .container { width: 100%; max-width: 380px; text-align: center; }
        .profile-img { 
            width: 96px; height: 96px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 16px; 
            border: 3px solid #38bdf8; 
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3); 
        }
        h1 { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
        p.bio { font-size: 14px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
        .links-container { display: flex; flex-direction: column; gap: 14px; }
        .btn { 
            display: block; 
            background: #1e293b; 
            color: #f8fafc; 
            padding: 16px 20px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); 
            transition: all 0.2s ease; 
            border: 1px solid #334155; 
        }
        .btn:active { transform: scale(0.97); background: #334155; }
        .footer { font-size: 11px; color: #64748b; margin-top: 40px; letter-spacing: 0.5px; text-transform: uppercase; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <p style="color: #94a3b8;">Cargando...</p>
    </div>

    <script>
        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            // SI NO HAY ID: Muestra la Landing Page Informativa de Polaris NFC
            if (!id) {
                document.title = "Polaris NFC";
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <h1>Polaris NFC</h1>
                        <p class="bio" style="margin-bottom: 0;">
                            Soluciones de conectividad rápida e inteligente para negocios locales. 
                            Conectamos clientes con tu información usando tecnología de proximidad NFC y códigos QR dinámicos.
                        </p>
                    </div>
                    <div class="footer">POLARIS NFC • TECNOLOGÍA DE PROXIMIDAD</div>
                `;
                return;
            }

            // SI HAY ID: Busca los datos en el JSON
            try {
                const response = await fetch('clients.json?v=' + new Date().getTime());
                const data = await response.json();
                
                const client = data[id];
                const app = document.getElementById('app');

                if (!client) {
                    app.innerHTML = `<div class="card"><h1>Perfil no activo</h1><p class="bio" style="margin-top:8px; margin-bottom:0;">Este dispositivo no está configurado aún.</p></div>`;
                    return;
                }

                // SI TIENE URL DIRECTA (ej. Google Maps directo): Redirige de inmediato
                if (client.direct_url && client.direct_url.trim() !== "") {
                    window.location.href = client.direct_url;
                    return;
                }

                // SI ES UN HUB DE ENLACES: Muestra los botones
                document.title = client.name;

                let html = `
                    <img src="${client.image || 'https://via.placeholder.com/150'}" class="profile-img" alt="${client.name}">
                    <h1>${client.name}</h1>
                    <p class="bio">${client.bio}</p>
                    <div class="links-container">
                `;

                if (client.links && client.links.length > 0) {
                    client.links.forEach(link => {
                        html += `<a href="${link.url}" class="btn" target="_blank" rel="noopener">${link.text}</a>`;
                    });
                }

                html += `</div><div class="footer">POLARIS NFC</div>`;
                app.innerHTML = html;

            } catch (error) {
                document.getElementById('app').innerHTML = `<div class="card"><h1>Error</h1><p class="bio" style="margin-bottom:0;">No se pudo cargar la información.</p></div>`;
            }
        }

        loadProfile();
    </script>
</body>
</html>
