<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf7f2">
<title>Polaris NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="public.css">
<style>
  .id { text-align: center; }
  .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 18px; background: var(--accent-soft); box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent); }
  .avatar.ph { display: flex; align-items: center; justify-content: center; color: var(--accent-ink); font: 700 44px var(--serif); }
  .id h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 8vw, 34px); line-height: 1.1; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .id .bio { color: var(--muted); font-size: 15px; margin: 10px auto 0; max-width: 32ch; overflow-wrap: anywhere; }

  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  .link { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 56px; padding: 14px 18px; border-radius: 14px; background: var(--surface); color: var(--text); border: 1px solid var(--line); text-decoration: none; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; transition: border-color .15s, transform .1s; }
  .link:hover { border-color: var(--accent-ink); }
  .link:active { transform: scale(.985); }
  /* El primer botón es la acción principal del negocio (casi siempre la reseña): lleva el color de acento */
  .link.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .link.primary:hover { border-color: var(--text); }
  .link.off { border-style: dashed; cursor: default; } /* solo en la vista previa: botón con enlace incompleto */

  /* Acceso a la carta: usa la línea de puntos, igual que dentro de la carta */
  .carta-link { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 14px 18px; margin-top: 4px; border-radius: 14px; background: var(--accent-soft); color: var(--text); text-decoration: none; transition: transform .1s; }
  .carta-link .t { font: 700 19px var(--serif); }
  .carta-link .v { font-weight: 600; color: var(--text); } /* sobre el fondo suave, el acento no siempre llega a 4.5:1 */
  .carta-link:hover .v { text-decoration: underline; text-underline-offset: 3px; }
  .carta-link:active { transform: scale(.985); }
  .carta-link .dots { border-color: var(--accent-ink); opacity: .45; }

  .redirect-note { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 18px; margin-top: 28px; text-align: center; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .landing h1 { font-family: var(--serif); font-size: 38px; font-weight: 700; line-height: 1.05; }
  .landing p { color: var(--muted); margin-top: 14px; font-size: 16px; max-width: 34ch; }
</style>
</head>
<body>
<main class="shell" id="app" aria-live="polite">
  <p class="loading">Cargando perfil…</p>
</main>

<script src="shared.js"></script>
<script>
const { esc, safeHttps, safeImg, initial, applyTheme, getProfile } = POLARIS;
const params = new URLSearchParams(location.search);
const id = params.get('id');
const PREVIEW = params.get('preview') === '1';   // usado por la vista previa del editor
const app = document.getElementById('app');

// Si la foto no carga, muestra la inicial del negocio
function fallbackImg(el) {
  const d = document.createElement('div');
  d.className = 'avatar ph'; d.setAttribute('aria-hidden', 'true');
  d.textContent = el.dataset.initial || '?';
  el.replaceWith(d);
}

function stateCard(title, text, action = '') {
  app.innerHTML = `<div class="state"><h1>${esc(title)}</h1><p>${esc(text)}</p>${action}</div>
    <footer class="foot"><a href="./">Polaris NFC</a></footer>`;
}

function render(p, pid) {
  applyTheme(p.theme);

  // Redirección directa: en la página real se va de inmediato; en la vista previa solo se avisa
  if (p.direct_url && p.direct_url.trim()) {
    const dest = safeHttps(p.direct_url);
    if (PREVIEW) {
      app.innerHTML = `<div class="state"><h1>${esc(p.name || 'Sin nombre')}</h1></div>
        <p class="redirect-note">${dest ? `Este stand lleva directo a:<br><b>${esc(dest)}</b>` : 'El enlace de redirección no es válido.'}</p>`;
      return;
    }
    if (!dest) return stateCard('Enlace no válido', 'Este stand tiene un enlace que no es seguro.');
    location.replace(dest);
    return;
  }

  document.title = p.name || 'Polaris NFC';
  const img = safeImg(p.image), ini = initial(p.name);
  const links = (p.links || []).filter(l => l && l.text && (PREVIEW || safeHttps(l.url)));
  const hasMenu = p.menu && (p.menu.categories || []).some(c => (c.items || []).length);

  app.innerHTML = `
    <header class="id">
      ${img
        ? `<img src="${esc(img)}" class="avatar" width="104" height="104" alt="" fetchpriority="high" data-initial="${esc(ini)}" onerror="fallbackImg(this)">`
        : `<div class="avatar ph" aria-hidden="true">${esc(ini)}</div>`}
      <h1>${esc(p.name || 'Sin nombre')}</h1>
      ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ''}
    </header>
    <nav class="links" aria-label="Enlaces">
      ${links.map((l, i) => {
        const u = safeHttps(l.url), cls = 'link' + (i === 0 ? ' primary' : '');
        return u
          ? `<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l.text)}<span class="sr"> (se abre en otra pestaña)</span></a>`
          : `<span class="${cls} off">${esc(l.text)}</span>`;
      }).join('')}
      ${hasMenu ? `<a class="carta-link" href="menu.html?id=${encodeURIComponent(pid || '')}"><span class="t">Carta</span><span class="dots" aria-hidden="true"></span><span class="v">Ver</span></a>` : ''}
    </nav>
    ${!links.length && !hasMenu ? '<p class="redirect-note">Este perfil todavía no tiene botones.</p>' : ''}
    <footer class="foot"><a href="./">Polaris NFC</a></footer>`;
}

function landing() {
  document.title = 'Polaris NFC';
  app.innerHTML = `
    <div class="landing" style="padding-top:12vh">
      <h1>Polaris NFC</h1>
      <p>Stands con NFC y código QR para negocios locales. Tus clientes acercan el teléfono y llegan directo a tus reseñas, tus redes o tu carta.</p>
    </div>
    <footer class="foot">Polaris NFC</footer>`;
}

async function load() {
  if (!id) return landing();
  try {
    const p = await getProfile(id);
    if (!p) return stateCard('Perfil no activo', 'Este stand todavía no está configurado.');
    render(p, id);
  } catch (e) {
    stateCard('No se pudo cargar', 'Revisa tu conexión a internet e intenta de nuevo.',
      '<div class="act"><button class="btn-plain" onclick="location.reload()">Reintentar</button></div>');
  }
}

if (PREVIEW) {
  // La vista previa recibe el borrador desde admin.html (mismo sitio) y no navega fuera
  addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== parent || !e.data || e.data.type !== 'polaris-preview') return;
    render(e.data.profile, e.data.id);
  });
  document.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); });
  parent.postMessage({ type: 'polaris-preview-ready', page: 'profile' }, location.origin === 'null' ? '*' : location.origin);
} else {
  load();
}
</script>
</body>
</html>
