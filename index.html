<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris NFC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc;
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 30px 20px; 
        }
        .container { width: 100%; max-width: 380px; text-align: center; }
        .profile-img { 
            width: 96px; height: 96px; 
            border-radius: 50%; 
            object-fit: cover; 
            margin-bottom: 16px; 
            border: 3px solid #38bdf8; 
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3); 
        }
        .profile-img.ph { display: inline-flex; align-items: center; justify-content: center; background: #1e293b; color: #38bdf8; font-size: 40px; font-weight: 700; }
        h1 { font-size: 24px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
        p.bio { font-size: 14px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
        .links-container { display: flex; flex-direction: column; gap: 14px; }
        .btn { 
            display: block; 
            background: #1e293b; 
            color: #f8fafc; 
            padding: 16px 20px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); 
            transition: all 0.2s ease; 
            border: 1px solid #334155; 
        }
        .btn:active { transform: scale(0.97); background: #334155; }
        .footer { font-size: 11px; color: #64748b; margin-top: 40px; letter-spacing: 0.5px; text-transform: uppercase; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <p style="color: #94a3b8;">Cargando...</p>
    </div>

    <script>
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Si no hay imagen (o no carga), muestra un círculo con la inicial del negocio
        function fallbackImg(el) {
            const d = document.createElement('div');
            d.className = 'profile-img ph';
            d.textContent = el.dataset.initial || '?';
            el.replaceWith(d);
        }

        const SUPABASE_URL = 'https://plwmvqdztejlfjbjzfjv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_QUBbXk2KJkCnr-ddVVGJRQ_2sdwK4VQ'; // clave pública, es seguro que esté aquí

        // Fuente principal: base de datos. Si un perfil es "igual a" otro, usa el contenido del otro.
        async function fromDb(id) {
            const get = async pid => {
                const r = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${encodeURIComponent(pid)}&select=id,name,bio,image,direct_url,links,menu,same_as`,
                    { headers: { apikey: SUPABASE_KEY }, signal: AbortSignal.timeout(4000) });
                if (!r.ok) throw new Error('db ' + r.status);
                return (await r.json())[0] || null;
            };
            let p = await get(id);
            if (p && p.same_as) p = (await get(p.same_as)) || p;
            return p;
        }

        // Respaldo: copia estática en el repo (por si la base de datos no responde)
        async function fromSnapshot(id) {
            const data = await (await fetch('clients.json?v=' + Date.now())).json();
            let p = data[id];
            if (p && p.same_as) p = data[p.same_as] || p;
            return p || null;
        }

        async function getClient(id) {
            try { return await fromDb(id); } catch (e) { return await fromSnapshot(id); }
        }

        // Solo se permiten enlaces https:// (y rutas locales img/...). Todo lo demás se descarta.
        const safeHttps = u => { try { const x = new URL(String(u || '').trim()); return x.protocol === 'https:' && x.hostname.includes('.') && !x.username && !x.password ? x.href : ''; } catch (e) { return ''; } };
        const safeImg = u => { u = String(u || '').trim(); return /^img\/[A-Za-z0-9_.\/-]+$/.test(u) && !u.includes('..') ? u : safeHttps(u); };

        async function loadProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            // SI NO HAY ID: Muestra la Landing Page Informativa de Polaris NFC
            if (!id) {
                document.title = "Polaris NFC";
                document.getElementById('app').innerHTML = `
                    <div class="card">
                        <h1>Polaris NFC</h1>
                        <p class="bio" style="margin-bottom: 0;">
                            Soluciones de conectividad rápida e inteligente para negocios locales. 
                            Conectamos clientes con tu información usando tecnología de proximidad NFC y códigos QR dinámicos.
                        </p>
                    </div>
                    <div class="footer">POLARIS NFC • TECNOLOGÍA DE PROXIMIDAD</div>
                `;
                return;
            }

            // SI HAY ID: Busca los datos en el JSON
            try {
                const client = await getClient(id);
                const app = document.getElementById('app');

                if (!client) {
                    app.innerHTML = `<div class="card"><h1>Perfil no activo</h1><p class="bio" style="margin-top:8px; margin-bottom:0;">Este dispositivo no está configurado aún.</p></div>`;
                    return;
                }

                // SI TIENE URL DIRECTA (ej. Google Maps directo): Redirige de inmediato
                if (client.direct_url && client.direct_url.trim() !== "") {
                    const dest = safeHttps(client.direct_url);
                    if (!dest) { app.innerHTML = `<div class="card"><h1>Enlace no válido</h1><p class="bio" style="margin-top:8px; margin-bottom:0;">Este stand tiene un enlace que no es seguro.</p></div>`; return; }
                    window.location.replace(dest);
                    return;
                }

                // SI ES UN HUB DE ENLACES: Muestra los botones
                document.title = client.name;

                let html = `
                    ${safeImg(client.image)
                        ? `<img src="${esc(safeImg(client.image))}" class="profile-img" alt="" data-initial="${esc((client.name || '?').trim().charAt(0).toUpperCase())}" onerror="fallbackImg(this)">`
                        : `<div class="profile-img ph">${esc((client.name || '?').trim().charAt(0).toUpperCase())}</div>`}
                    <h1>${esc(client.name)}</h1>
                    <p class="bio">${esc(client.bio)}</p>
                    <div class="links-container">
                `;

                if (client.links && client.links.length > 0) {
                    client.links.forEach(link => {
                        const u = safeHttps(link.url);
                        if (u && link.text) html += `<a href="${esc(u)}" class="btn" target="_blank" rel="noopener noreferrer">${esc(link.text)}</a>`;
                    });
                }

                if (client.menu && (client.menu.categories || []).some(c => (c.items || []).length)) {
                    html += `<a href="menu.html?id=${encodeURIComponent(id)}" class="btn">📋 Ver menú</a>`;
                }
                html += `</div><div class="footer">POLARIS NFC</div>`;
                app.innerHTML = html;

            } catch (error) {
                document.getElementById('app').innerHTML = `<div class="card"><h1>Error</h1><p class="bio" style="margin-bottom:0;">No se pudo cargar la información.</p></div>`;
            }
        }

        loadProfile();
    </script>
</body>
</html>
