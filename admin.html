<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Panel · Polaris NFC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px 16px 90px; }
  #app { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 14px 0; } .muted { color: #94a3b8; font-size: 13px; } .grow { flex: 1; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin: 12px 0 5px; text-transform: uppercase; letter-spacing: .4px; }
  label.chk { display: flex; gap: 10px; align-items: center; text-transform: none; font-size: 15px; color: #f8fafc; margin: 0; }
  input, textarea, select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-size: 15px; font-family: inherit; }
  input[type=checkbox] { width: 20px; height: 20px; }
  textarea { min-height: 70px; resize: vertical; }
  button, .btn { background: #38bdf8; color: #0f172a; border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.ghost, .btn.ghost { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; }
  .item { display: flex; gap: 12px; align-items: center; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 13px; margin-bottom: 8px; cursor: pointer; }
  .id { font-weight: 800; color: #38bdf8; min-width: 38px; }
  .lrow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid #334155; }
  .lrow.o { flex-direction: row; align-items: center; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #0f172acc; backdrop-filter: blur(8px); padding: 12px 16px; border-top: 1px solid #334155; }
  .bar button { width: 100%; max-width: 560px; display: block; margin: 0 auto; padding: 14px; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #16a34a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 9; max-width: 90%; }
  #toast.err { background: #dc2626; } #toast.show { display: block; }
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient('https://plwmvqdztejlfjbjzfjv.supabase.co', 'sb_publishable_QUBbXk2KJkCnr-ddVVGJRQ_2sdwK4VQ');
let me, isAdmin = false, profiles = [], owners = [], locks = {}, draft = null, unlocked = null;

const $ = id => document.getElementById(id);
const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = u => { u = (u || '').trim(); return !u || /^(https?:|mailto:|tel:)/i.test(u) ? u : 'https://' + u; };
const pubUrl = id => location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '') + 'index.html?id=' + id;
function toast(m, err) { const t = $('toast'); t.textContent = m; t.className = (err ? 'err ' : '') + 'show'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3800); }

/* ---- clave de stands vendidos (PBKDF2) ---- */
const hex = b => Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => Uint8Array.from(h.match(/../g) || [], x => parseInt(x, 16));
async function derive(p, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
  return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, k, 256));
}
async function hashPass(p) { const s = crypto.getRandomValues(new Uint8Array(16)); return `pbkdf2$${hex(s)}$${await derive(p, s)}`; }
async function verifyPass(p, st) { const [, s, h] = String(st || '').split('$'); return !!(s && h) && (await derive(p, unhex(s))) === h; }

/* ---- sesión ---- */
function renderLogin() {
  $('app').innerHTML = `<h1>Polaris NFC</h1><div class="card">
    <label>Correo</label><input id="em" type="email" autocomplete="email">
    <label>Clave</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px"><button id="in">Entrar</button><button class="ghost" id="up">Crear cuenta</button></div>
    <p class="muted" style="margin-top:12px">¿Eres cliente? Crea tu cuenta y avísale al administrador el correo que usaste para que te dé acceso a tu perfil.</p></div>`;
  const cred = () => ({ email: $('em').value.trim(), password: $('pw').value });
  on('in', async () => { const r = await sb.auth.signInWithPassword(cred()); r.error ? toast('Correo o clave incorrectos', true) : boot(r.data.user); });
  on('up', async () => {
    const r = await sb.auth.signUp(cred());
    if (r.error) return toast(r.error.message, true);
    r.data.session ? boot(r.data.user) : toast('Cuenta creada. Revisa tu correo para confirmarla.');
  });
}
async function boot(user) {
  me = user;
  const a = await sb.from('admins').select('user_id').eq('user_id', user.id);
  isAdmin = !!(a.data && a.data.length);
  await load(); renderList();
}
async function loadOwners() { owners = (await sb.rpc('admin_owners')).data || []; }
async function load() {
  let q = sb.from('profiles').select('*').order('id');
  if (!isAdmin) {
    const o = await sb.from('profile_owners').select('profile_id');
    const ids = (o.data || []).map(x => x.profile_id);
    if (!ids.length) { profiles = []; return; }
    q = q.in('id', ids);
  }
  const r = await q; if (r.error) return toast(r.error.message, true);
  profiles = r.data;
  if (isAdmin) {
    const l = await sb.from('profile_locks').select('*');
    locks = Object.fromEntries((l.data || []).map(x => [x.profile_id, x.lock]));
    await loadOwners();
  }
}

/* ---- lista ---- */
const badge = p => p.sold ? '🔒 Vendido' + (locks[p.id] ? ' · con clave' : '') : p.same_as ? '↔ Igual al ' + p.same_as : p.direct_url ? '↗ Redirección directa' : 'Con botones';
function renderList() {
  draft = null; unlocked = null;
  $('app').innerHTML = `<div class="top"><b class="grow">Polaris NFC</b><span class="muted">${esc(me.email)}${isAdmin ? ' · admin' : ''}</span><button class="ghost" id="out">Salir</button></div>
    ${profiles.length ? '' : '<div class="card">Tu cuenta aún no tiene perfiles asignados. Pídele al administrador que te dé acceso con este correo.</div>'}
    ${profiles.map(p => `<div class="item" data-id="${p.id}"><span class="id">${p.id}</span><div class="grow"><b>${esc(p.name)}</b><div class="muted">${badge(p)}</div></div>›</div>`).join('')}`;
  on('out', async () => { await sb.auth.signOut(); renderLogin(); });
  document.querySelectorAll('.item').forEach(e => e.onclick = () => openProfile(e.dataset.id));
}
function openProfile(id) {
  const p = profiles.find(x => x.id === id);
  if (isAdmin && p.sold && unlocked !== id) return renderLocked(p);
  draft = JSON.parse(JSON.stringify(p)); draft.links = draft.links || []; draft._pass = '';
  renderEdit();
}
function renderLocked(p) {
  const key = locks[p.id];
  $('app').innerHTML = `<div class="top"><button class="ghost" id="back">← Volver</button></div>
    <div class="card"><b style="font-size:17px">🔒 Stand ${p.id} vendido</b>
    <p class="muted" style="margin-top:6px">${esc(p.name)} ya está en funcionamiento. Está bloqueado para que no lo cambies por error.</p>
    ${key ? '<label>Clave</label><input id="pk" type="password">' : ''}
    <button id="go" style="margin-top:14px">${key ? 'Desbloquear' : 'Editar de todos modos'}</button></div>`;
  on('back', renderList);
  on('go', async () => {
    if (key ? !(await verifyPass($('pk').value, key)) : !confirm('Este stand está marcado como vendido. ¿Seguro que quieres editarlo?')) return key && toast('Clave incorrecta', true);
    unlocked = p.id; openProfile(p.id);
  });
}

/* ---- editor ---- */
function renderEdit() {
  const d = draft, alias = isAdmin && d.same_as, own = owners.filter(o => o.profile_id === d.id);
  $('app').innerHTML = `<div class="top"><button class="ghost" id="back">← Volver</button><span class="grow"></span><a class="btn ghost" target="_blank" rel="noopener" href="${esc(pubUrl(d.id))}">Ver ↗</a><button class="ghost" id="copy">Copiar link</button></div>
  <h1>Perfil ${d.id}</h1>
  ${isAdmin ? `<div class="card"><label style="margin-top:0">Es igual a otro perfil (comparten contenido)</label><select id="same"><option value="">— No, tiene su propio contenido —</option>${profiles.filter(x => x.id !== d.id && !x.same_as).map(x => `<option value="${x.id}" ${d.same_as === x.id ? 'selected' : ''}>${x.id} · ${esc(x.name)}</option>`).join('')}</select></div>` : ''}
  ${alias ? `<div class="card">Este perfil muestra el contenido del <b>${esc(d.same_as)}</b>. Para cambiar lo que dice, edita ese perfil.</div>` : `
  <div class="card"><label style="margin-top:0">Nombre</label><input data-k="name" value="${esc(d.name)}">
    <label>Descripción</label><textarea data-k="bio">${esc(d.bio)}</textarea>
    <label>Imagen (link o ruta)</label><input data-k="image" value="${esc(d.image)}" placeholder="https://..."></div>
  ${isAdmin ? `<div class="card"><label style="margin-top:0">Redirección directa (opcional)</label><input data-k="direct_url" value="${esc(d.direct_url)}" placeholder="Si lo llenas, ignora los botones">
    <p class="muted" style="margin-top:6px">Úsalo para ir directo a la reseña de Google, sin pantalla intermedia.</p></div>` : ''}
  <div class="card"><b>Botones</b>${d.links.map((l, i) => `<div class="lrow"><input data-l="${i}:text" value="${esc(l.text)}" placeholder="Texto del botón"><input data-l="${i}:url" value="${esc(l.url)}" placeholder="Link"><div class="row"><button class="ghost" data-up="${i}">↑</button><button class="ghost" data-dn="${i}">↓</button><button class="ghost" data-rm="${i}">✕</button></div></div>`).join('')}
    <button class="ghost" id="add" style="margin-top:12px">+ Agregar botón</button></div>`}
  ${isAdmin ? `<div class="card"><label class="chk"><input type="checkbox" id="sold" ${d.sold ? 'checked' : ''}> 🔒 Marcar como vendido</label>
    ${d.sold ? `<label>Clave de protección (opcional)</label><input data-k="_pass" type="password" autocomplete="new-password" placeholder="${locks[d.id] ? 'Vacío = mantener la actual' : 'Una clave que recuerdes'}">${locks[d.id] ? '<button class="ghost" id="rmlock" style="margin-top:8px">Quitar clave</button>' : ''}` : ''}</div>
  <div class="card"><b>Clientes con acceso a este perfil</b>
    ${own.map(o => `<div class="lrow o"><span class="grow">${esc(o.email)}</span><button class="ghost" data-unlink="${esc(o.email)}">Quitar</button></div>`).join('') || '<p class="muted">Nadie todavía.</p>'}
    <label>Dar acceso por correo</label><div class="row"><input id="oem" type="email" placeholder="correo del cliente"><button id="link">Dar acceso</button></div>
    <p class="muted" style="margin-top:6px">El cliente debe haber creado su cuenta antes con ese correo.</p></div>` : ''}
  <div class="bar"><button id="save">Guardar cambios</button></div>`;

  document.querySelectorAll('[data-k]').forEach(i => i.oninput = () => d[i.dataset.k] = i.value);
  document.querySelectorAll('[data-l]').forEach(i => i.oninput = () => { const [x, k] = i.dataset.l.split(':'); d.links[x][k] = i.value; });
  const mv = (i, j) => { if (j < 0 || j >= d.links.length) return; [d.links[i], d.links[j]] = [d.links[j], d.links[i]]; renderEdit(); };
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => mv(+b.dataset.up, +b.dataset.up - 1));
  document.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => mv(+b.dataset.dn, +b.dataset.dn + 1));
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { d.links.splice(+b.dataset.rm, 1); renderEdit(); });
  document.querySelectorAll('[data-unlink]').forEach(b => b.onclick = async () => {
    const r = await sb.rpc('admin_unlink_owner', { p_email: b.dataset.unlink, p_profile: d.id });
    r.error ? toast(r.error.message, true) : (await loadOwners(), renderEdit());
  });
  on('back', renderList);
  on('copy', () => navigator.clipboard.writeText(pubUrl(d.id)).then(() => toast('Link copiado')));
  on('add', () => { d.links.push({ text: '', url: '' }); renderEdit(); });
  on('rmlock', async () => { await sb.from('profile_locks').delete().eq('profile_id', d.id); delete locks[d.id]; toast('Clave quitada'); renderEdit(); });
  on('link', async () => {
    const r = await sb.rpc('admin_link_owner', { p_email: $('oem').value, p_profile: d.id });
    r.error ? toast(r.error.message, true) : (toast('Acceso dado'), await loadOwners(), renderEdit());
  });
  if ($('same')) $('same').onchange = e => { d.same_as = e.target.value || null; renderEdit(); };
  if ($('sold')) $('sold').onchange = e => { d.sold = e.target.checked; renderEdit(); };
  on('save', save);
}
async function save() {
  const d = draft, f = { name: d.name, bio: d.bio, image: (d.image || '').trim(), links: d.links.filter(l => l.text && l.url).map(l => ({ text: l.text.trim(), url: norm(l.url) })) };
  if (isAdmin) { f.direct_url = norm(d.direct_url); f.same_as = d.same_as || null; f.sold = !!d.sold; }
  $('save').disabled = true;
  const r = await sb.from('profiles').update(f).eq('id', d.id).select('id');
  if (r.error || !r.data.length) { $('save').disabled = false; return toast(r.error ? r.error.message : 'No tienes permiso para editar este perfil', true); }
  if (isAdmin) {
    if (!d.sold) await sb.from('profile_locks').delete().eq('profile_id', d.id);
    else if (d._pass) await sb.from('profile_locks').upsert({ profile_id: d.id, lock: await hashPass(d._pass) });
  }
  toast('Guardado ✔'); await load(); renderList();
}

sb.auth.getSession().then(({ data }) => data.session ? boot(data.session.user) : renderLogin());
</script>
</body>
</html>
