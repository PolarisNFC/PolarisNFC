<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf7f2">
<title>Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="public.css">
<style>
  .shell { max-width: 560px; padding-top: 20px; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; }
  .back:hover { color: var(--text); }

  .head { text-align: center; padding: 18px 0 26px; }
  .head h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 9vw, 42px); line-height: 1.05; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .head .sub { font-family: var(--serif); font-style: italic; font-weight: 500; color: var(--accent-ink); font-size: 19px; margin-top: 4px; }

  /* Pestañas de categoría: quedan fijas arriba al hacer scroll */
  .tabs { position: sticky; top: 0; z-index: 2; background: var(--bg); margin: 0 -20px; padding: 10px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { flex: none; display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .tabs a:hover { color: var(--text); background: var(--accent-soft); }
  .tabs a[aria-current="true"] { color: var(--on-accent); background: var(--accent); }

  section { scroll-margin-top: 72px; padding-top: 30px; }
  /* Título de categoría con filetes a los lados, como en una carta impresa */
  section h2 { display: flex; align-items: center; gap: 14px; font-family: var(--serif); font-weight: 700; font-size: 22px; text-align: center; margin-bottom: 8px; }
  section h2::before, section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .items { list-style: none; }
  .item { padding: 14px 0; }
  .item + .item { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: baseline; gap: 10px; }
  .name { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .price { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent-ink); }
  .desc { color: var(--muted); font-size: 14px; margin-top: 3px; max-width: 46ch; overflow-wrap: anywhere; }
  .item.out .name, .item.out .price { color: var(--muted); text-decoration: line-through; }
  .tag { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; text-decoration: none; vertical-align: 2px; }
</style>
</head>
<body>
<main class="shell" id="app" aria-live="polite">
  <p class="loading">Cargando carta…</p>
</main>

<script src="shared.js"></script>
<script>
const { esc, applyTheme, getProfile, fmtPrice } = POLARIS;
const params = new URLSearchParams(location.search);
const id = params.get('id');
const PREVIEW = params.get('preview') === '1';
const app = document.getElementById('app');
const backHref = pid => 'index.html?id=' + encodeURIComponent(pid || '');
let observer;

function stateCard(title, text, action = '') {
  app.innerHTML = `<div class="state"><h1>${esc(title)}</h1><p>${esc(text)}</p>${action}</div><footer class="foot"><a href="./">Polaris NFC</a></footer>`;
}

function render(p, pid) {
  applyTheme(p.theme);
  const cats = ((p.menu && p.menu.categories) || []).filter(c => (c.items || []).length);
  const back = `<a class="back" href="${esc(backHref(pid))}"><span aria-hidden="true">←</span> Volver al perfil</a>`;
  if (!cats.length) {
    app.innerHTML = `${back}<div class="state"><h1>Carta en preparación</h1><p>Este negocio todavía no ha publicado su carta.</p></div>`;
    return;
  }
  document.title = 'Carta · ' + (p.name || '');
  app.innerHTML = `
    ${back}
    <header class="head"><h1>${esc(p.name || '')}</h1><p class="sub">Carta</p></header>
    ${cats.length > 1 ? `<nav class="tabs" aria-label="Categorías">${cats.map((c, i) => `<a href="#c${i}" data-i="${i}">${esc(c.name || 'Carta')}</a>`).join('')}</nav>` : ''}
    ${cats.map((c, i) => `
      <section id="c${i}" aria-labelledby="h${i}">
        <h2 id="h${i}">${esc(c.name || 'Carta')}</h2>
        <ul class="items">${c.items.map(it => `
          <li class="item${it.soldout ? ' out' : ''}">
            <div class="row">
              <span class="name">${esc(it.name)}</span>${it.soldout ? '<span class="tag">Agotado</span>' : ''}
              <span class="dots" aria-hidden="true"></span>
              <span class="price">${esc(fmtPrice(it.price))}</span>
            </div>
            ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ''}
          </li>`).join('')}
        </ul>
      </section>`).join('')}
    <footer class="foot"><a href="./">Polaris NFC</a></footer>`;
  trackTabs();
}

// Marca la pestaña de la categoría que se está viendo
function trackTabs() {
  const tabs = [...document.querySelectorAll('.tabs a')];
  if (observer) observer.disconnect();
  if (!tabs.length) return;
  const set = i => tabs.forEach((t, j) => {
    if (j === i) {
      t.setAttribute('aria-current', 'true');
      const bar = t.parentElement, l = t.offsetLeft; // la barra es sticky, así que offsetLeft es relativo a ella
      if (l < bar.scrollLeft || l + t.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = l - 20;
    }
    else t.removeAttribute('aria-current');
  });
  set(0);
  observer = new IntersectionObserver(es => {
    const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (vis) set(+vis.target.id.slice(1));
  }, { rootMargin: '-80px 0px -60% 0px' });
  document.querySelectorAll('section[id^="c"]').forEach(s => observer.observe(s));
}

async function load() {
  if (!id) return stateCard('Carta no disponible', 'Falta el número del stand en el enlace.');
  try {
    const p = await getProfile(id);
    if (!p) return stateCard('Carta no disponible', 'Este stand todavía no está configurado.');
    render(p, id);
  } catch (e) {
    stateCard('No se pudo cargar la carta', 'Revisa tu conexión a internet e intenta de nuevo.',
      '<div class="act"><button class="btn-plain" onclick="location.reload()">Reintentar</button></div>');
  }
}

if (PREVIEW) {
  addEventListener('message', e => {
    if (e.origin !== location.origin || e.source !== parent || !e.data || e.data.type !== 'polaris-preview') return;
    render(e.data.profile, e.data.id);
  });
  // En la vista previa solo funcionan las pestañas (anclas internas)
  document.addEventListener('click', e => { const a = e.target.closest('a'); if (a && !a.getAttribute('href').startsWith('#')) e.preventDefault(); });
  parent.postMessage({ type: 'polaris-preview-ready', page: 'menu' }, location.origin === 'null' ? '*' : location.origin);
} else {
  load();
}
</script>
</body>
</html>
